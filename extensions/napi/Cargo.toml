[package]
name = "dbobj-napi"
version = "0.1.0"
edition = "2021"
description = "N-API bindings for the DBOBJ database"
license = "MIT"
repository = "https://github.com/nglmercer/DBOBJ"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.8.6", features = ["napi6", "async", "serde-json"] }
napi-derive = "3.5.5"
dbobj = { path = "../../" }
dbobj-sql = { path = "../sql" }
compact_str = "0.9.0"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2.1.3"

[features]
mimalloc = ["dbobj/mimalloc"]
