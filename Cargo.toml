[package]
name = "dbobj"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.18"

[[bench]]
name = "db_bench"
harness = false

[dev-dependencies]
criterion = "0.8.2"
