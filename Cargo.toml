[package]
name = "dbobj"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = { version = "0.8.12", features = ["serde"] }
bitcode = { version = "0.6.9", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
compact_str = { version = "0.9.0", features = ["rkyv", "serde"] }
mimalloc = "0.1.50"
nohash-hasher = "0.2.0"
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.140"
string-interner = { version = "0.20.0", features = ["serde"] }
thiserror = "2.0.18"
rkyv = { version = "0.8.16", features = ["bytecheck", "std"] }
memmap2 = "0.9.5"

[[bench]]
name = "db_bench"
harness = false

[dev-dependencies]
criterion = "0.8.2"
rusqlite = "0.31.0"
