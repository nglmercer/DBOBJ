[package]
name = "dbobj-server"
version = "0.1.0"
edition = "2021"
description = "Server layer for DBOBJ with configurable transports (TCP, UDS, in-process)"

[dependencies]
dbobj = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bincode = "1.3"
async-trait = "0.1"
thiserror = "2"
parking_lot = "0.12"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
ahash = "0.8"
tempfile = "3"
tokio-test = "0.4"

[lib]
name = "dbobj_server"
path = "src/lib.rs"

[[bin]]
name = "dbobj-server"
path = "src/main.rs"